    domain: core-pipeline
    path: 'skills/connect-to-server/SKILL.md'
    package: 'packages/squilo'
    description: >
      Configure Server() with hostname, port, encryption, trustServerCertificate.
      First step in the Squilo pipeline. Returns ServerChain for chaining with Auth.
    requires: []
    sources:
      - 'dodevs/Squilo:packages/squilo/src/pipes/server/index.ts'
      - 'dodevs/Squilo:packages/squilo/src/pipes/server/types.ts'

  - name: setup-authentication
    slug: setup-authentication
    type: core
    domain: core-pipeline
    path: 'skills/setup-authentication/SKILL.md'
    package: 'packages/squilo'
    description: >
      Configure SQL auth with UserAndPassword or Azure AD with ActiveDirectoryAccessToken
      from @squilo/msal-auth-strategy. Chained after Server(). Returns AuthenticationChain.
    requires:
      - connect-to-server
    sources:
      - 'dodevs/Squilo:packages/squilo/src/pipes/auth/index.ts'
      - 'dodevs/Squilo:packages/squilo/src/pipes/auth/strategies/userAndPassword.ts'
      - 'dodevs/Squilo:packages/squilo/src/pipes/auth/strategies/types.ts'
      - 'dodevs/Squilo:packages/msal-auth-strategy/src/msal.ts'

  - name: connect-to-databases
    slug: connect-to-databases
    type: core
    domain: core-pipeline
    path: 'skills/connect-to-databases/SKILL.md'
    package: 'packages/squilo'
    description: >
      Connect to single DB, array of DBs with concurrency limit, or dynamically discover
      databases via query with Database column. ExecutionOptions add retry, timeout and
      AbortSignal cancellation. Returns ConnectionChain for Execute or Retrieve.
    requires:
      - setup-authentication
    sources:
      - 'dodevs/Squilo:packages/squilo/src/pipes/connect/index.ts'
      - 'dodevs/Squilo:packages/squilo/src/pipes/connect/types.ts'

  - name: retrieve-data
    slug: retrieve-data
    type: core
    domain: core-pipeline
    path: 'skills/retrieve-data/SKILL.md'
    package: 'packages/squilo'
    description: >
      Query data across databases with Retrieve(). Streaming results via ReadableStream.
      ConnectionPoolWrapper with AsyncDisposable, transaction$ with commit$ for atomicity.
      Must end chain with Output() or Transform().Output() to consume the stream.
    requires:
      - connect-to-databases
    sources:
      - 'dodevs/Squilo:packages/squilo/src/pipes/retrieve/index.ts'
      - 'dodevs/Squilo:packages/squilo/src/pipes/retrieve/types.ts'
      - 'dodevs/Squilo:packages/squilo/src/pool/index.ts'

  - name: execute-updates
    slug: execute-updates
    type: core
    domain: core-pipeline
    path: 'skills/execute-updates/SKILL.md'
    package: 'packages/squilo'
    description: >
      Run UPDATE, INSERT, DELETE, DDL across databases with Execute().
      Returns Promise<ExecutionError[]> directly — no Output() method available.
      SAFE_GUARD limits errors before halting further connections.
    requires:
      - connect-to-databases
    sources:
      - 'dodevs/Squilo:packages/squilo/src/pipes/execute/index.ts'
      - 'dodevs/Squilo:packages/squilo/src/pipes/shared/runner/index.ts'

  - name: transform-data
    slug: transform-data
    type: core
    domain: core-pipeline
    path: 'skills/transform-data/SKILL.md'
    package: 'packages/squilo'
    description: >
      Insert expensive post-processing (file I/O, API calls, computation) after Retrieve
      via Transform() TransformStream. Database connections close before Transform runs.
      Not for simple mapping — inline that in Retrieve callback instead.
    requires:
      - retrieve-data
    sources:
      - 'dodevs/Squilo:packages/squilo/src/pipes/transform/index.ts'
      - 'dodevs/Squilo:packages/squilo/src/pipes/transform/types.ts'

  - name: output-results
    slug: output-results
    type: core
    domain: core-pipeline
    path: 'skills/output-results/SKILL.md'
    package: 'packages/squilo'
    description: >
      Consume Retrieve stream with Output(strategy). Built-in: MergeOutputStrategy,
      JsonOutputStrategy, ConsoleOutputStrategy. Excel via @squilo/xls-output-strategy.
      Returns [ExecutionError[], result] tuple — always destructure. Filename auto-derived.
    requires:
      - retrieve-data
    sources:
      - 'dodevs/Squilo:packages/squilo/src/pipes/output/index.ts'
      - 'dodevs/Squilo:packages/squilo/src/pipes/output/strategies/merge.ts'
      - 'dodevs/Squilo:packages/squilo/src/pipes/output/strategies/json.ts'
      - 'dodevs/Squilo:packages/squilo/src/pipes/output/strategies/console.ts'
      - 'dodevs/Squilo:packages/xls-output-strategy/src/xls.ts'

  - name: handle-errors
    slug: handle-errors
    type: core
    domain: core-pipeline
    path: 'skills/handle-errors/SKILL.md'
    package: 'packages/squilo'
    description: >
      Understand SAFE_GUARD env var (default=1), ExecutionError[] tuple returns,
      SAFE_GUARD halting behavior, TimeoutError/AbortError/UnfinishedWorkError, mssql-specific error fields (code, number, state,
      lineNumber). Errors returned not thrown. Check array length after every operation.
    requires: []
    sources:
      - 'dodevs/Squilo:packages/squilo/src/pipes/shared/runner/index.ts'
      - 'dodevs/Squilo:packages/squilo/src/pipes/shared/runner/types.ts'
      - 'dodevs/Squilo:packages/squilo/src/utils/load-env.ts'
      - 'dodevs/Squilo:packages/squilo/test/error-handling.spec.ts'

